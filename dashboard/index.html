<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR AI Screening - Intelligent Candidate Matching</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3748;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .file-input-label i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .file-name {
            margin-top: 10px;
            font-weight: 500;
            color: #4a5568;
        }

        .candidates-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        .score-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .score-high {
            background: #c6f6d5;
            color: #22543d;
        }

        .score-medium {
            background: #feebc8;
            color: #744210;
        }

        .score-low {
            background: #fed7d7;
            color: #742a2a;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #f56565;
        }

        .notification.info {
            background: #4299e1;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-robot"></i> HR AI Screening</h1>
            <p>Intelligent candidate matching powered by AI</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="statVacancy">-</div>
                <div class="stat-label">Vacancy Created</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statCandidates">0</div>
                <div class="stat-label">Candidates Loaded</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statAvgScore">-</div>
                <div class="stat-label">Average Score</div>
            </div>
        </div>

        <div class="grid">
            <!-- Create Vacancy Card -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-briefcase"></i> Create Vacancy</h2>
                <div class="form-group">
                    <label for="title">Vacancy Title *</label>
                    <input type="text" id="title" placeholder="e.g. Senior Python Developer">
                </div>
                <div class="form-group">
                    <label for="skills">Required Skills (comma separated) *</label>
                    <input type="text" id="skills" placeholder="Python, Django, PostgreSQL, Docker">
                </div>
                <div class="form-group">
                    <label for="seniority">Seniority Level *</label>
                    <input type="text" id="seniority" placeholder="e.g. Senior, Middle, Junior">
                </div>
                <div class="form-group">
                    <label for="description">Job Description *</label>
                    <textarea id="description" placeholder="Describe the role, responsibilities, and requirements..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="createVacancy()" id="btnCreateVacancy">
                    <i class="fas fa-plus"></i> Create Vacancy
                </button>
            </div>

            <!-- Upload Resumes Card -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-file-upload"></i> Upload Resumes</h2>
                <div class="form-group">
                    <div class="file-input-wrapper">
                        <input type="file" id="file" accept=".zip" onchange="updateFileName()">
                        <label for="file" class="file-input-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <div>Click to upload ZIP file with resumes</div>
                            <div style="font-size: 0.85rem; color: #a0aec0; margin-top: 5px;">
                                Supported formats: PDF, DOCX
                            </div>
                        </label>
                    </div>
                    <div class="file-name" id="fileName"></div>
                </div>
                <button class="btn btn-primary" onclick="uploadResumes()" id="btnUpload">
                    <i class="fas fa-upload"></i> Upload & Process
                </button>
            </div>

            <!-- Start Screening Card -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-paper-plane"></i> Start Screening</h2>
                <div class="form-group">
                    <label for="n">Number of Top Candidates to Contact *</label>
                    <input type="number" id="n" placeholder="e.g. 5" min="1">
                </div>
                <button class="btn btn-primary" onclick="startScreening()" id="btnScreening">
                    <i class="fas fa-rocket"></i> Contact Candidates via Telegram
                </button>
            </div>
        </div>

        <!-- Candidates Section -->
        <div class="candidates-section">
            <h2 class="card-title"><i class="fas fa-users"></i> Candidates</h2>
            <div class="table-container">
                <table id="candidatesTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Score</th>
                            <th>Telegram</th>
                            <th>Seniority</th>
                            <th>Experience</th>
                            <th>English</th>
                            <th>Salary</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <div>No candidates yet. Upload resumes to get started.</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
