<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI HR Screener | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .drag-over { border-color: #6366f1 !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="glass sticky top-0 z-50 border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 00-11.76 4.715 2 2 0 01-3.236 0 11.955 11.955 0 00-11.76-4.715z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">HR AI Screening <span class="text-indigo-600 text-sm font-medium">MVP</span></h1>
            </div>
            <div class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 flex items-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Системы активны
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                
                <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate__animated animate__fadeInLeft">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-slate-900">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745V6a2 2 0 012-2h14a2 2 0 012 2v7.255z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 8V6a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                        </svg>
                        1. Создать вакансию
                    </h2>
                    <div class="space-y-4">
                        <input id="title" type="text" placeholder="Название (напр. Python Dev)" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <input id="skills" type="text" placeholder="Навыки (React, Python)" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <select id="seniority" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white">
                            <option value="Junior">Junior</option>
                            <option value="Middle">Middle</option>
                            <option value="Senior">Senior</option>
                        </select>
                        <textarea id="description" rows="3" placeholder="Описание требований..." class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"></textarea>
                        <button onclick="createVacancy()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition-all active:transform active:scale-95 shadow-lg shadow-indigo-100">
                            Сохранить вакансию
                        </button>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate__animated animate__fadeInLeft" style="animation-delay: 0.1s">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-slate-900">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        2. Загрузить резюме
                    </h2>
                    
                    <div id="drop-zone" class="relative border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center transition-all bg-slate-50/50 group">
                        <input type="file" id="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".zip">
                        
                        <div id="zone-idle" class="space-y-2">
                            <div class="text-slate-500 group-hover:text-indigo-500 transition-colors font-medium">Перетащите ZIP сюда</div>
                            <div class="text-xs text-slate-300">или нажмите для выбора</div>
                        </div>

                        <div id="zone-active" class="hidden flex flex-col items-center animate__animated animate__bounceIn">
                            <div class="bg-indigo-100 text-indigo-600 p-2 rounded-full mb-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div id="file-name" class="text-sm font-bold text-slate-700 truncate max-w-[180px]">file.zip</div>
                            <button onclick="clearFile(event)" class="mt-2 text-xs text-rose-500 hover:text-rose-700 font-semibold underline z-20 relative">Удалить</button>
                        </div>
                    </div>

                    <button onclick="uploadResumes()" id="btn-upload" class="w-full mt-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl transition-all flex justify-center items-center gap-2">
                        <span>Начать AI-анализ</span>
                        <div id="loader-upload" class="hidden loader w-4 h-4 border-2 border-white rounded-full border-t-transparent"></div>
                    </button>
                </section>
            </div>

            <!-- Правая колонка -->
            <div class="lg:col-span-2 space-y-6">
                <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate__animated animate__fadeInRight">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 class="text-xl font-bold text-slate-900">Результаты скрининга</h2>
                        <div class="flex items-center gap-2">
                            <input id="n" type="number" value="3" class="w-16 px-3 py-1.5 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500">
                            <button onclick="startScreening()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-medium transition-all shadow-lg shadow-emerald-50 active:transform active:scale-95">
                                Связаться в Telegram
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                    <th class="pb-4 font-semibold">Кандидат</th>
                                    <th class="pb-4 font-semibold">Опыт</th>
                                    <th class="pb-4 font-semibold text-center">Score</th>
                                    <th class="pb-4 font-semibold">Telegram</th>
                                </tr>
                            </thead>
                            <tbody id="candidate-list" class="divide-y divide-slate-50"></tbody>
                        </table>
                        <div id="empty-state" class="py-20 text-center">
                            <p class="text-slate-400">Нет данных. Загрузите резюме для начала анализа.</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
